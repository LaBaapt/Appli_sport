<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S7 — Carnet SUPER7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161514; --paper:#E7DFD1; --blood:#5A1914; --coral:#FF5B4D; --orange:#FF7A1A;
  --bg:var(--paper); --fg:var(--ink); --mute:rgba(22,21,20,.62); --rule:rgba(22,21,20,.22); --card:rgba(22,21,20,.06);
  --display:"Anton","Impact","Haettenschweiler","Arial Narrow",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161514; --fg:#E7DFD1; --mute:rgba(231,223,209,.6); --rule:rgba(231,223,209,.2); --card:rgba(231,223,209,.06); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#161514; --fg:#E7DFD1; --mute:rgba(231,223,209,.6); --rule:rgba(231,223,209,.2); --card:rgba(231,223,209,.06); color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 200px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;gap:12px}
.brand{font-family:var(--display);color:var(--coral);font-size:28px;line-height:1;background:none;border:0;padding:0}
.link{font-family:var(--cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:15px;background:none;border:0;padding:10px 0}
.coral{color:var(--coral)}
.h-xl{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(76px,25vw,150px);line-height:1.02;margin:22px 0 20px;overflow-wrap:break-word}
.h-l{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,12vw,84px);line-height:1.04;margin:18px 0 14px;overflow-wrap:break-word;hyphens:auto}
.h-m{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1.08;margin:0}
.h-s{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:22px;line-height:1.05;margin:0;letter-spacing:.01em}
.meta{font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:15px;line-height:1.4;color:var(--mute);margin:0}
.p{margin:8px 0;max-width:62ch}
.small{font-size:14px;color:var(--mute)}
.rule{border:0;border-top:1px solid var(--rule);margin:22px 0}
.rows{margin:18px 0}
.row{display:flex;gap:14px;align-items:center;border-top:1px solid var(--rule);padding:12px 0}
.row:last-child{border-bottom:1px solid var(--rule)}
.row .num{font-family:var(--cond);font-size:15px;min-width:26px;color:var(--mute)}
.row .nm{font-family:var(--cond);font-weight:700;font-size:23px;text-transform:uppercase;line-height:1.02;flex:1;min-width:0}
.row .nm small{display:block;font-weight:500;font-size:14px;letter-spacing:.04em;color:var(--mute);margin-top:3px}
.row .val{font-family:var(--cond);font-weight:600;font-size:18px;white-space:nowrap}
.btn{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;padding:13px 16px;border:2px solid currentColor;background:transparent;border-radius:0;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{font-size:14px;padding:8px 10px;border-width:1.5px}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.orange{background:var(--orange);color:#161514;border-color:var(--orange)}
.btn.ghost{border-color:transparent;padding-left:0;padding-right:0}
.btn:disabled{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.cta{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--orange);color:#161514;border:0;width:100%;display:flex;justify-content:center;padding:0}
.cta span{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:22px 20px;font-family:var(--display);font-size:30px;text-transform:uppercase;line-height:1}
.cta svg{width:38px;height:22px;flex:none}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--coral);color:#161514;padding:10px 14px;margin:14px 0;border:0;width:100%;text-align:left}
.banner b{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase}
.banner svg{width:28px;height:18px;flex:none}
.strip{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin:16px 0 6px}
.strip i{height:14px;background:var(--rule)}
.strip i.done{background:var(--orange)}
.strip i.next{background:var(--coral)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:7px 11px;border:1.5px solid var(--rule);background:none;white-space:nowrap;border-radius:0}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:block;margin:12px 0}
.field span{display:block;font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);margin-bottom:4px}
.input{width:100%;background:transparent;border:0;border-bottom:2px solid var(--rule);padding:8px 0;font-family:var(--cond);font-weight:600;font-size:22px;border-radius:0}
.input:focus{outline:none;border-bottom-color:var(--coral)}
select.input{appearance:none;-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat .big{font-family:var(--display);font-size:44px;line-height:1.05}
.stat .lab{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute)}
.chart{width:100%;height:auto;display:block;margin:8px 0 4px;overflow:visible}
.scroll-x{overflow-x:auto}
details.tips{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:16px 0}
details.tips summary{list-style:none;padding:14px 0;font-family:var(--cond);font-weight:700;font-size:20px;text-transform:uppercase;display:flex;justify-content:space-between}
details.tips summary::-webkit-details-marker{display:none}
details.tips summary::after{content:"+";font-family:var(--display);font-weight:400}
details.tips[open] summary::after{content:"−"}
.tip{padding:10px 0 12px;border-top:1px solid var(--rule)}
.tip h4{margin:0 0 4px;font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:17px}
.tip p{margin:0;max-width:62ch}
.tabs{display:flex;border-bottom:2px solid var(--fg);margin:8px 0 18px}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--mute)}
.tabs button.on{background:var(--fg);color:var(--bg)}
.sess{margin:0 0 30px}
.blockh{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);margin:16px 0 2px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sscheck{display:inline-flex;gap:7px;align-items:center;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--fg)}
.sscheck input{width:20px;height:20px;margin:0;accent-color:var(--orange)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{height:52px;background:none;border:0;padding:0 2px;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:0;font-size:clamp(10.5px,3.1vw,12.5px);color:var(--mute);position:relative;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tabbar button.on{color:var(--fg)}
.tabbar button.on::before{content:"";position:absolute;left:16%;right:16%;top:-1px;height:3px;background:var(--coral)}
.blk{margin:16px 0 4px;border-top:1px solid var(--rule)}
.blk button{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;text-align:left;color:var(--mute);font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:19px;line-height:1.05}
.blk button.on{color:var(--paper)}
.blk button.on .lb{color:var(--coral)}
.blk .bs{font-weight:600;font-size:17px}
.exl{border-top:1px solid var(--rule);padding:12px 0 10px}
.exl-h{display:flex;align-items:baseline;gap:10px}
.exl-h .lb{font-family:var(--cond);font-weight:700;color:var(--coral);font-size:18px;min-width:26px}
.exl-h .h-s{flex:1;font-size:24px}
.exl .target{font-size:16px;margin-top:4px}
.finedit{border-top:2px solid var(--fg);margin-top:18px;padding-top:12px}
.rvh{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:20px;margin:16px 0 4px}
.rvh:first-child{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dh{font-family:var(--cond);font-weight:600;font-size:12px;text-transform:uppercase;color:var(--mute);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1/1.12;border:1px solid var(--rule);padding:3px;font-family:var(--cond);font-size:13px;display:flex;flex-direction:column;justify-content:space-between;background:none;text-align:left;border-radius:0}
.cal .d.out{visibility:hidden}
.cal .d.today{border:2px solid var(--fg)}
.cal .d b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1}
.cal .d.plan{background:var(--card);border-color:var(--coral)}
.cal .d.plan b{color:var(--coral)}
.cal .d.done{background:var(--orange);border-color:var(--orange);color:#161514}
.cal .d.done b{color:#161514}
.cal .d.miss{border-style:dashed}
.cal .d.end{background:var(--coral);color:#161514;border-color:var(--coral)}
.cal .d.end b{color:#161514}
.month{font-family:var(--display);font-size:28px;text-transform:uppercase;margin:22px 0 8px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:44px;height:44px;border:1.5px solid var(--rule);background:none;font-family:var(--cond);font-weight:700;border-radius:0}
.days button.on{background:var(--coral);border-color:var(--coral);color:#161514}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.toggle input{width:22px;height:22px;accent-color:var(--orange)}
/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,9,8,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--coral)}
.sheet .top{padding-top:0}
.menu a,.menu button.mi{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 0;font-family:var(--display);font-size:36px;text-transform:uppercase;line-height:1;color:inherit;text-decoration:none}
/* session runner */
.run{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--blood);color:var(--paper);--mute:rgba(231,223,209,.62);--rule:rgba(231,223,209,.22);--card:rgba(231,223,209,.07);--fg:var(--paper);--bg:var(--blood);color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
.run .wrap{padding-bottom:180px}
.run .counter{font-family:var(--cond);font-weight:600;color:var(--coral);letter-spacing:.06em;font-size:16px}
.run h1{color:var(--coral)}
.target{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:18px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.tempo-btn{background:none;border:0;border-bottom:1.5px dashed currentColor;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit}
.explain{background:var(--card);padding:10px 12px;margin:10px 0;font-size:15px}
.explain ol{margin:4px 0 0;padding-left:18px}
.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;margin:20px 0 6px}
.cell{font-family:var(--display);text-align:left;line-height:1;padding:2px 0;border:0;background:none;color:rgba(231,223,209,.32)}
.cell .r{font-size:44px;display:block}
.cell .k{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.04em;display:block;margin-top:4px}
.cell.done{color:var(--paper)}
.cell.cur{color:var(--coral)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 8px}
.stepper span{display:block;font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);margin-bottom:6px}
.stepper div{display:flex;align-items:stretch;border:1.5px solid var(--rule)}
.stepper button{width:44px;background:none;border:0;font-family:var(--display);font-size:24px}
.stepper input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;font-family:var(--display);font-size:34px;padding:6px 0;border-left:1.5px solid var(--rule);border-right:1.5px solid var(--rule);border-radius:0}
.stepper input:focus{outline:none;background:var(--card)}
.rest{margin:18px 0;border-top:2px solid var(--coral);padding-top:10px}
.rest .n{font-family:var(--display);font-size:clamp(110px,40vw,200px);line-height:1;color:var(--paper)}
.rest .n.mm{font-size:clamp(76px,24vw,150px)}
.bar{height:4px;background:var(--rule);margin:12px 0 4px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--coral)}
.runfoot{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--blood);pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.runfoot .in{max-width:560px;margin:0 auto;padding:0 20px;position:relative;height:96px;overflow:hidden;pointer-events:auto}
.runfoot .line{position:absolute;left:20px;right:120px;top:22px;height:3px;background:var(--rule)}
.runfoot .line i{position:absolute;left:0;top:0;bottom:0;background:var(--coral)}
.runfoot .clock{position:absolute;left:20px;top:44px;font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.04em}
.runfoot .pause{position:absolute;left:44%;top:38px;font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:6px 4px}
.runfoot .giant{position:absolute;right:6px;top:10px;font-family:var(--display);font-size:150px;line-height:.9;color:var(--paper)}
.runbtns{display:grid;gap:8px;margin:16px 0}
.runbtns .btn{width:100%;font-size:18px;padding:16px}
.runbtns .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.review{background:var(--paper);color:var(--ink);padding:18px 16px;margin:16px 0;--mute:rgba(22,21,20,.62);--rule:rgba(22,21,20,.22);--fg:var(--ink);--bg:var(--paper)}
.review .rr{display:grid;grid-template-columns:54px 1fr 1fr 40px;gap:8px;align-items:center;border-top:1px solid var(--rule);padding:8px 0}
.review .rr input{width:100%;background:transparent;border:0;border-bottom:2px solid var(--rule);font-family:var(--display);font-size:26px;padding:4px 0;border-radius:0;color:var(--ink)}
.review .rr input:focus{outline:none;border-bottom-color:var(--coral)}
.review .x{background:none;border:0;font-family:var(--display);font-size:22px;color:var(--ink)}
.moves{margin:8px 0;padding:0;list-style:none}
.moves li{font-family:var(--cond);font-weight:700;font-size:22px;text-transform:uppercase;border-top:1px solid var(--rule);padding:8px 0}
.phase{font-family:var(--display);font-size:42px;text-transform:uppercase;line-height:1}
/* summary */
.sum{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--paper);color:var(--ink);--fg:var(--ink);--bg:var(--paper);--mute:rgba(22,21,20,.62);--rule:rgba(22,21,20,.3);color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
.sum .rows .row .nm{font-size:19px}
.again{background:var(--orange);color:#161514;border:0;width:100%;text-align:left;display:block;padding:0;overflow:hidden;margin-top:24px}
.again .w{font-family:var(--display);font-size:clamp(120px,42vw,220px);line-height:.9;display:block;white-space:nowrap;margin:14px -6px 0 -6px;text-transform:uppercase}
.again .l{display:flex;justify-content:space-between;align-items:center;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:17px;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.again svg{width:34px;height:20px}
.sync{font-family:var(--cond);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.empty{border:1.5px dashed var(--rule);padding:18px;margin:14px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
"use strict";
/* ============ DONNÉES DU PROGRAMME SUPER7 (4 séances / semaine) ============ */
const E=(n,t,s,r,note="",alt=[])=>({n,t,s,r,note,alt});
const FIN={
  frac:{type:"interval",title:"Fractionné",desc:"7 minutes : 20 s à fond, 40 s de récupération.",machines:"Vélo, rameur, SkiErg ou assault bike",rounds:7,work:20,rest:40},
  cal:{type:"cal",title:"2 × 70 calories",desc:"Deux fois 70 calories, récupération libre entre les deux.",machines:"Rameur, SkiErg, assault bike ou air runner",rounds:2},
  situp:{type:"fortime",title:"Sit up + burpees",desc:"7 tours de 10 sit up + 10 burpees, le plus vite possible.",rounds:7,moves:["10 sit up","10 burpees"]},
  enfer:{type:"amrap",title:"Cinq à sept en enfer",desc:"Un maximum de tours en 7 minutes, 7 répétitions par exercice.",dur:420,moves:["7 jumping jacks","7 jump squats","7 burpees","7 mountain climbers","7 sit up"]},
  abdos:{type:"amrap",title:"Routine abdos",desc:"Un maximum de tours en 7 minutes.",dur:420,moves:["7 crunchs bras tendus","7 relevés de genoux"]}
};
function finDef(x){
  if(!x)return null;if(typeof x==="string")return FIN[x]||null;
  if(x.type==="walk"){const dm=num(x.durMin)||20,sp=x.speed!=null&&x.speed!==""?num(x.speed):5,inc=x.incline!=null&&x.incline!==""?num(x.incline):10;
    return{type:"walk",title:"Marche inclinée",speed:sp,incline:inc,durMin:dm,dur:dm*60,desc:`${fmtKg(dm)} min à ${fmtKg(sp)} km/h, pente ${fmtKg(inc)} %`,machines:"Tapis de course"}}
  return null;
}
const PROGRAM=[
 {label:"Semaines 1 à 3",short:"S1–3",weeks:[1,2,3],sessions:[
  {name:"Upper",blocks:[
   {rest:90,ex:[E("Tractions","20X0",5,"8","Remplaçable par tirage vertical",["Tirage vertical"]),E("Dips","20X0",5,"8","Remplaçable par pompes (max de reps)",["Pompes"])]},
   {rest:60,ex:[E("Développé militaire haltères","2010",4,"10","À faire debout"),E("Face pull","20X0",5,"12")]},
   {rest:45,ex:[E("Extension triceps trichée","2011",4,"10"),E("Spider curl","2011",5,"12","Avec barre ou haltères")]}],fin:"frac"},
  {name:"Lower",blocks:[
   {rest:90,ex:[E("Leg curl","2010",5,"8","Allongé, assis ou debout"),E("Squat aux haltères","3010",5,"8","Talons surélevés")]},
   {rest:60,ex:[E("Soulevé de terre jambes tendues","21X0",4,"10","Aux haltères"),E("Step up","20X1",4,"10","Box à hauteur des genoux")]},
   {rest:45,ex:[E("Leg extension","",5,"12"),E("Fentes arrière","",5,"12","Focus fessiers")]}],fin:"situp"},
  {name:"Upper",blocks:[

function parseReps(r,s){
  const str=String(r||"").trim();
  if(str.includes("-")){const a=str.split("-").map(x=>x.trim());while(a.length<s)a.push(a[a.length-1]);return a.slice(0,Math.max(s,a.length))}
  return Array(s||3).fill(str||"10");
}
function decodeTempo(t){
  if(!t)return null;

const store={db:null,uid:null,chains:{},
  local(){if(UI.demo)return;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}},
  put(id,data){
    if(UI.demo||!this.db||!this.uid)return;
    const ref=this.db.collection("data/users/"+this.uid).doc(id);
    this.chains[id]=(this.chains[id]||Promise.resolve()).then(()=>data===null?ref.delete():ref.set(data)).catch(err=>{if(err&&err.code==="quota_exceeded"){UI.syncNote="Stockage en ligne plein";paintSync()}});
  },
  async init(){
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(!db||!user)return;
      const uid=await user.id(); if(!uid)return;
      this.db=db;this.uid=uid;
      const timer=setTimeout(()=>{UI.syncNote="Synchronisation en attente";paintSync()},10000);
      const snap=await db.collection("data/users/"+uid).get();
      clearTimeout(timer);
      const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
      const shown=S;if(UI.demo)S=REAL;
      let changed=false;
      const st=remote.state;
      if(st&&(st.updatedAt||0)>(S.stateAt||0)){S.settings=st.settings||S.settings;S.custom=st.custom||[];S.overrides=st.overrides||{};S.body=st.body||[];S.stateAt=st.updatedAt;changed=true}
      else if(S.stateAt) this.put("state",statePayload());
      Object.keys(remote).filter(k=>k.startsWith("log_")).forEach(k=>{const l=remote[k];const key=k.slice(4);if(!S.logs[key]||(l.updatedAt||0)>(S.logs[key].updatedAt||0)){S.logs[key]=l;changed=true}});
      Object.keys(S.logs).forEach(key=>{if(!remote["log_"+key])this.put("log_"+key,S.logs[key])});
      const lv=remote.live;
      if(lv&&(lv.updatedAt||0)>(S.liveAt||0)){S.live=lv.live||null;S.liveAt=lv.updatedAt;changed=true}
      UI.syncNote="Synchronisé avec ton compte";
      if(UI.demo){REAL=S;S=shown}else this.local();
      if(changed)render();else paintSync();
    }catch(e){UI.syncNote="Enregistré sur cet appareil";paintSync()}
  }
};
function statePayload(){return{settings:S.settings,custom:S.custom,overrides:S.overrides,body:S.body,updatedAt:S.stateAt}}

function deleteLog(key){delete S.logs[key];store.local();store.put("log_"+key,null)}
function saveLive(){S.liveAt=Date.now();store.local();store.put("live",{live:S.live,updatedAt:S.liveAt})}

const phaseOf=w=>w<=3?0:w<=5?1:2;
function schedule(){
  const days=(S.settings.days&&S.settings.days.length)?S.settings.days:[1,2,4,5];
  const out=[];const d=parseYmd(S.settings.start);let g=0;
  while(out.length<28&&g<500){if(days.includes(d.getDay()))out.push(ymd(d));d.setDate(d.getDate()+1);g++}
  return out;
}
function slots(){const sc=schedule();return sc.map((date,k)=>{const week=Math.floor(k/4)+1,s=k%4;return{k,week,s,ph:phaseOf(week),key:`w${week}s${s+1}`,date}})}

  const blocks=base.blocks.map((b,bi)=>({rest:b.rest,superset:!(ov.ss&&ov.ss[bi]===false),ex:b.ex.map((e,i)=>{const sw=ov.swap&&ov.swap[`${bi}-${i}`];return sw?{...e,n:sw,orig:e.n}:{...e}})}));
  if(ov.extra&&ov.extra.length){let cur=null;ov.extra.forEach((x,xi)=>{const e={...x,xi};if(x.ss&&cur)cur.ex.push(e);else{cur={rest:x.rest||90,bonus:true,ex:[e]};blocks.push(cur)}});blocks.forEach(b=>{if(b.bonus)b.superset=b.ex.length>1})}
  const fin=ov.fin?(ov.fin.type==="none"?null:ov.fin):base.fin;
  return{name:base.name,blocks,fin,baseFin:base.fin};
}
function buildSteps(sess){
  const out=[];
  sess.blocks.forEach((b,bi)=>{const lt=String.fromCharCode(65+bi);
    const exs=b.ex.map((e,i)=>({label:lt+(i+1),n:e.n,t:e.t||"",s:e.s,r:e.r,note:e.note||"",alt:e.alt||[]}));
    if(b.superset&&exs.length>1)out.push({kind:"ex",label:lt,bonus:!!b.bonus,superset:true,rest:b.rest,exs,rounds:Math.max(...exs.map(x=>x.s))});
    else exs.forEach(x=>out.push({kind:"ex",label:x.label,bonus:!!b.bonus,superset:false,rest:b.rest,exs:[x],rounds:x.s}));
  });
  if(sess.fin)out.push({kind:"fin",fin:sess.fin});
  return out;
}
function estMinutes(sess){let sec=0;sess.blocks.forEach(b=>b.ex.forEach(e=>{sec+=e.s*(45+b.rest*(b.superset?.5:1))}));return Math.round(sec/60+(sess.fin?(finDef(sess.fin).dur||420)/60+1:0)+5)}
function history(name){
  const sl=slug(name);const out=[];
  Object.values(S.logs).forEach(l=>(l.ex||[]).forEach(e=>{if(slug(e.n)===sl&&e.sets&&e.sets.length)out.push({date:l.date,sets:e.sets,key:l.key})}));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
const e1rm=(kg,reps)=>kg>0&&reps>0?kg*(1+Math.min(reps,15)/30):0;
function lastKg(name){const h=history(name);if(!h.length)return"";const s=h[h.length-1].sets;const k=Math.max(...s.map(x=>num(x.kg)));return k>0?fmtKg(k):""}

let REAL=null;
function makeDemo(){
  let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7)-35);
  const D={settings:{start:ymd(mon),days:[1,2,4,5],autoRest:true},custom:[],overrides:{},body:[],logs:{},live:null,stateAt:0,liveAt:0};
  const keep=S;S=D;
  const BASE={"Développé couché":60,"Développé incliné haltères":22,"Développé semi-incliné":24,"Développé militaire haltères":16,"Squat":70,"Squat guidé":60,"Squat aux haltères":20,"Goblet squat":24,"Presse à cuisses":120,"Leg extension":40,"Leg curl":35,"Soulevé de terre jambes tendues":22,"Tirage horizontal":50,"Tirage vertical":50,"Tirage vertical unilatéral":25,"Rowing un bras":26,"Rowing buste penché":50,"Face pull":20,"Oiseau buste penché":8,"Élévations latérales":9,"Curl barre":25,"Curl incliné":12,"Spider curl":20,"Extension triceps trichée":12,"Extension triceps corde":20,"Extension triceps poulie haute":25,"Écarté couché":14,"Pec deck inversé":30,"Fentes arrière":14,"Fentes bulgares":14,"Step up":14};
  const seen={};const td=today();
  slots().filter(x=>x.date<td).forEach(sl=>{
    const sess=getSession(sl.ph,sl.s);const ex=[];
    sess.blocks.forEach(b=>b.ex.forEach(e=>{
      const k=seen[e.n]=(seen[e.n]||0)+1;const tg=parseReps(e.r,e.s);const type=exType(e.n);const sets=[];
      const nS=rnd()<.15?e.s-1:e.s;
      for(let i=0;i<nS;i++){
        let kg=0;if(type==="c"){const b0=BASE[e.n]||20;kg=Math.round(b0*(1+.03*(k-1))*(i>2&&rnd()<.3?.95:1)/1.25)*1.25}
        const t=tg[i]==="max"?12+k+ri(0,4):num(tg[i]);
        const reps=type==="p"&&/Tractions|Dips/.test(e.n)?Math.max(4,Math.min(t,5+k+ri(-1,1)-Math.floor(i/2))):Math.max(1,t-(i>=2?ri(0,2):ri(0,1)));
        sets.push({kg:String(fmtKg(kg)),reps:String(reps)});
      }
      ex.push({n:e.n,sets});
    }));
    const F=finDef(sess.fin);let fin=null;
    if(F.type==="walk")fin={title:F.title,type:"walk",time:F.dur,speed:F.speed,incline:F.incline,rounds:0,laps:[],note:""};
    else if(F.type==="interval")fin={title:F.title,type:F.type,time:420,rounds:7,laps:[],note:""};
    else if(F.type==="amrap")fin={title:F.title,type:F.type,time:420,rounds:ri(4,6)+Math.floor(sl.week/3),laps:[],note:""};
    else if(F.type==="fortime")fin={title:F.title,type:F.type,time:ri(780,900)-sl.week*25,rounds:7,laps:[],note:""};
    else{const a=ri(230,270)-sl.week*4;fin={title:F.title,type:F.type,time:a*2+ri(60,120),rounds:2,laps:[a,a*2+ri(60,120)],note:""}}
    const st=parseYmd(sl.date);st.setHours(18,30);
    D.logs[sl.key]={key:sl.key,kind:"prog",title:`Semaine ${sl.week}, séance ${pad(sl.s+1)} ${sess.name}`,week:sl.week,date:sl.date,startedAt:+st,dur:ri(52,72)*60,ex,fin,updatedAt:1};
  });
  const start={weight:105,waist:104,hip:112,chest:115,shoulders:127,arm:38,thigh:66},end={weight:101.4,waist:98.5,hip:109,chest:113.5,shoulders:127.8,arm:38.6,thigh:64.6};
  for(let w=0;w<6;w++){const d=new Date(mon);d.setDate(d.getDate()+w*7);if(ymd(d)>td)break;const e={id:"demo"+w,date:ymd(d)};
    Object.keys(start).forEach(k=>{const v=start[k]+(end[k]-start[k])*(w/5)+(k==="weight"?(rnd()-.5)*.8:(rnd()-.5)*.4);e[k]=Math.round(v*10)/10});D.body.push(e)}
  S=keep;return D;
}

function lineChart(pts){
  if(pts.length<1)return"";
  const W=340,H=170,pl=6,pr=6,pt=18,pb=26;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn){mx+=1;mn=Math.max(0,mn-1)}
  const x=i=>pts.length===1?W/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const step=Math.ceil(pts.length/7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${pts.length} séances">
  <line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="currentColor" stroke-width="1.5"/>
  ${pts.map((p,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${y(p.y)}" y2="${H-pb}" stroke="currentColor" stroke-dasharray="2 3" opacity=".6"/>`).join("")}
  <polyline fill="none" stroke="currentColor" stroke-width="1.8" points="${pts.map((p,i)=>`${x(i)},${y(p.y)}`).join(" ")}"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.y)}" r="4.5" fill="currentColor"/>`).join("")}
  ${pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="12" font-weight="600" fill="currentColor">${esc(p.l)}</text>`:"").join("")}
  <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].y)-10}" text-anchor="${pts.length===1?"middle":"end"}" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="13" font-weight="700" fill="currentColor">${fmtKg(pts[pts.length-1].y)}</text></svg>`;
}
function barChart(data){
  const W=340,H=160,pb=24,pt=16;const mx=Math.max(1,...data.map(d=>d.y));const bw=(W)/data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume par semaine">
  <line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="currentColor" stroke-width="1.5"/>
  ${data.map((d,i)=>{const h=(H-pb-pt)*d.y/mx;return `<rect x="${i*bw+6}" y="${H-pb-h}" width="${bw-12}" height="${h}" fill="${d.y?"#FF7A1A":"none"}"/>${d.y?`<text x="${i*bw+bw/2}" y="${H-pb-h-4}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="11" font-weight="600" fill="currentColor">${d.y>=1000?fmtKg(Math.round(d.y/100)/10)+"t":d.y}</text>`:""}<text x="${i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="12" font-weight="600" fill="currentColor">${d.l}</text>`}).join("")}</svg>`;
}

function unitData(i){const L=S.live;if(!L.data[i])L.data[i]={done:0,ex:null};return L.data[i]}
function lastSetKg(name,i){const h=history(name);if(!h.length)return"";const ss=h[h.length-1].sets;const s=ss[Math.min(i,ss.length-1)];return s&&num(s.kg)?fmtKg(num(s.kg)):""}
function ensureRows(i){
  const L=S.live;const u=L.steps[i];const d=unitData(i);
  if(!d.ex){d.ex=u.exs.map(x=>({n:x.n,sets:[]}));d.gen=0}
  if(d.gen==null)d.gen=Math.max(...d.ex.map(e=>e.sets.length));
  u.exs.forEach((x,k)=>{d.ex[k].n=x.n});
  for(let r=d.gen;r<d.done;r++){u.exs.forEach((x,k)=>{if(u.superset&&r>=x.s)return;const e=d.ex[k];const tg=parseReps(x.r,x.s);const prev=e.sets[e.sets.length-1];const t=tg[r]||tg[tg.length-1];e.sets.push({kg:prev?prev.kg:(lastSetKg(x.n,r)||(exType(x.n)==="c"?"":"0")),reps:t==="max"?"":t})})}

}

function paintRest(){
  const box=$("#restBox");const L=S.live;if(!box||!L)return;
  if(!L.rest){box.innerHTML="";return}
  const r=L.rest;const remain=r.paused!=null?r.paused:Math.max(0,r.endsAt-Date.now());
  if(!box.dataset.on){box.dataset.on="1";box.innerHTML=`<div class="rest" role="timer" aria-live="off"><div class="meta">Repos, la série sera validée à la fin</div><div class="n" id="restNum"></div><div class="bar"><i id="restBar"></i></div><div class="btns"><button class="btn sm" data-act="restAdj" data-v="-15">−15 s</button><button class="btn sm" data-act="restAdj" data-v="15">+15 s</button><button class="btn sm" data-act="restPause" id="restPauseBtn"></button><button class="btn sm solid" data-act="restSkip">Terminer le repos</button><button class="btn sm ghost" data-act="restCancel">Annuler</button></div></div>`}
  $("#restNum").textContent=String(Math.ceil(remain/1000));
  $("#restBar").style.width=`${100-Math.min(100,remain/(r.dur*1000)*100)}%`;
  $("#restPauseBtn").textContent=r.paused!=null?"Reprendre":"Pause";
}
function setRest(sec){unlockAudio();S.live.rest={endsAt:Date.now()+sec*1000,dur:sec,paused:null}}
function completeRound(){const L=S.live;const u=L.steps[L.step];L.rest=null;if(u&&u.kind==="ex"){const d=unitData(L.step);d.done=Math.min(d.done+1,u.rounds)}saveLive();if(L.stage==="ex")renderRun();else{const b=$("#restBox");if(b){delete b.dataset.on;b.innerHTML=""}}}
function startRest(sec){setRest(sec);saveLive();const box=$("#restBox");if(box)delete box.dataset.on;paintRest()}
let lastSec=-1;
setInterval(()=>{
  const L=S.live;if(!L||UI.view!=="seance")return;
  const c=$("#clock");if(c)c.textContent=mmss((Date.now()-L.startedAt)/1000);
  if(L.rest&&L.rest.paused==null){
    const remain=L.rest.endsAt-Date.now();
    const s=Math.ceil(remain/1000);
    if(s<=3&&s>0&&s!==lastSec){beep(660,.08)}lastSec=s;
    if(remain<=0){alarm();completeRound()}
    else paintRest();
  }
  const st=L.steps[L.step];
  if(st&&st.kind==="fin"&&L.stage!=="summary")tickFin(st);
},250);
function tickFin(st){
  const F=finDef(st.fin);const f=S.live.fin;const el=finElapsed(f)/1000;
  const nEl=$("#finNum");if(!nEl)return;
  if(F.type==="interval"){
    const cyc=F.work+F.rest,total=F.rounds*cyc;
    if(el>=total){if(f.running){f.acc=total*1000;f.running=false;alarm();saveLive();renderRun()}nEl.textContent="0";$("#finPhase").textContent="Terminé";return}
    const round=Math.floor(el/cyc)+1,inC=el%cyc,work=inC<F.work;
    const left=Math.ceil(work?F.work-inC:cyc-inC);
    const ph=f.running||f.acc?(work?"À fond":"Récup"):"Prêt";
    if(f.running){const cue=round+(work?"w":"r");if(f.cue!==cue){f.cue=cue;work?beep(1175,.25):beep(523,.25)}if(left<=3&&left!==f.lc){f.lc=left;beep(700,.06)}}
    $("#finPhase").textContent=ph;nEl.textContent=String(left);
    $("#finBar").style.width=`${(el/total)*100}%`;$("#finRound").textContent=`Tour ${round} / ${F.rounds}`;
  }else if(F.type==="amrap"||F.type==="walk"){
    const left=F.dur-el;
    if(left<=0){if(f.running){f.acc=F.dur*1000;f.running=false;alarm();saveLive();renderRun()}nEl.textContent="00:00";return}
    nEl.textContent=mmss(Math.ceil(left));$("#finBar").style.width=`${(el/F.dur)*100}%`;
  }else nEl.textContent=mmss(el);
}
function finishSession(){
  const L=S.live;
  const ex=[];L.steps.forEach((st,i)=>{if(st.kind!=="ex"||!L.data[i]||!L.data[i].done)return;const d=L.data[i].ex?L.data[i]:ensureRows(i);d.ex.forEach(e=>{if(e.sets.length)ex.push({n:e.n,sets:e.sets.map(s=>({kg:String(s.kg??""),reps:String(s.reps??"")}))})})});
  const finStep=L.steps.find(s=>s.kind==="fin");
  let fin=null;
  if(finStep&&L.fin&&(L.fin.saved||L.fin.acc||L.fin.running||L.fin.rounds)&&!L.fin.skipped){const F=finDef(finStep.fin);const el=Math.round(finElapsed(L.fin)/1000);fin={title:F.title,type:F.type,time:F.type==="walk"&&!el?F.dur:el,rounds:L.fin.rounds||(L.fin.laps||[]).length,laps:L.fin.laps||[],note:L.fin.note||""};if(F.type==="walk"){fin.speed=L.fin.speed!=null&&L.fin.speed!==""?num(L.fin.speed):F.speed;fin.incline=L.fin.incline!=null&&L.fin.incline!==""?num(L.fin.incline):F.incline}}
  S.logs[L.key]={key:L.key,kind:L.kind,title:L.title,week:L.week||null,date:today(),startedAt:L.startedAt,dur:Math.round((Date.now()-L.startedAt)/1000),ex,fin};
  saveLog(L.key);
  L.rest=null;L.stage="summary";saveLive();renderRun();
}
function startSession(o){
  unlockAudio();
  S.live={v:2,key:o.key,kind:o.kind,title:o.title,week:o.week||null,startedAt:Date.now(),step:0,stage:"ex",steps:o.steps,data:{},fin:{},rest:null};
  saveLive();UI.tempoOpen=false;
  if(location.hash==="#seance")render();else location.hash="seance";
}
function startSlotK(k){
  const sl=slots()[k];const sess=getSession(sl.ph,sl.s);
  startSession({key:sl.key,kind:"prog",week:sl.week,title:`Semaine ${sl.week}, séance ${pad(sl.s+1)} ${sess.name}`,steps:buildSteps(sess)});
}
function nextStep(){
  const L=S.live;
  if(L.step+1>=L.steps.length){finishSession();return}
  L.step++;L.stage="ex";UI.tempoOpen=false;saveLive();renderRun();$("#run")&&($("#run").scrollTop=0);
}

  runSwap:d=>{const L=S.live;const u=L.steps[L.step];const x=u.exs[+d.k];picker(`Remplacer ${x.n}`,x.alt,n=>{x.n=n;const ud=unitData(L.step);if(ud.ex&&ud.ex[+d.k]){ud.ex[+d.k].n=n}saveLive();closeSheet();renderRun()})},
  runMenu:()=>sheet(`<header class="top"><span class="h-s">Séance en pause</span><button class="link" data-act="closeSheet">Fermer</button></header>
    <div class="runbtns"><button class="btn solid" data-act="closeSheet">Reprendre</button><button class="btn" data-act="goHome">Revenir à l’accueil (la séance reste ouverte)</button><button class="btn" data-act="finishNow">Terminer et enregistrer maintenant</button><button class="btn" data-act="abandon">Abandonner sans enregistrer</button></div>`),
  goHome:()=>{closeSheet();location.hash="accueil"},
  finishNow:()=>{closeSheet();finishSession()},
  abandon:()=>{if(!confirm("Abandonner la séance ? Rien ne sera enregistré."))return;closeSheet();S.live=null;saveLive();location.hash="accueil"},
  closeRun:()=>{S.live=null;saveLive();keepAwake(false);location.hash="accueil"},
  finToggle:()=>{unlockAudio();const f=S.live.fin;if(f.running){f.acc=finElapsed(f);f.running=false}else{f.t0=Date.now();f.running=true}saveLive();renderRun()},
  finReset:()=>{if(!confirm("Remettre le chrono du finisher à zéro ?"))return;S.live.fin={note:S.live.fin.note||""};saveLive();renderRun()},
  round:d=>{const L=S.live;const f=L.fin;const F=finDef(L.steps[L.step].fin);f.rounds=Math.max(0,(f.rounds||0)+parseInt(d.v));if(F.type==="fortime"&&f.rounds>=F.rounds&&f.running){f.acc=finElapsed(f);f.running=false;alarm()}else if(parseInt(d.v)>0)beep(880,.08);saveLive();renderRun()},
  lap:()=>{const L=S.live;const f=L.fin;const F=finDef(L.steps[L.step].fin);f.laps=f.laps||[];f.laps.push(Math.round(finElapsed(f)/1000));if(f.laps.length>=F.rounds){f.acc=finElapsed(f);f.running=false;alarm()}else beep(880,.1);saveLive();renderRun()},
  finSave:()=>{const f=S.live.fin;if(f.running){f.acc=finElapsed(f);f.running=false}f.saved=true;finishSession()},
  finSkip:()=>{S.live.fin={skipped:true};finishSession()}
};
function addExtra(p,s,n){const k=`p${p}s${s}`;const o=S.overrides[k]||(S.overrides[k]={});o.extra=o.extra||[];const x=libFind(n)||{};o.extra.push({n,t:"",s:3,r:x.t==="d"?"30":"10",note:""});saveState()}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;if(el.dataset.act==="closeSheet"&&el.dataset.self&&e.target!==el)return;if(el.tagName!=="A")e.preventDefault();fn(el.dataset,el,e);if(el.tagName==="A"){closeSheet()}});
document.addEventListener("input",e=>{
  const b=e.target.dataset.bind;if(!b)return;const v=e.target.value;
  if(b==="rkg"||b==="rreps"){const ud=unitData(S.live.step);const k=+e.target.dataset.st,i=+e.target.dataset.i;const sets=ud.ex[k].sets;const f=b==="rkg"?"kg":"reps";const old=sets[i][f];sets[i][f]=v;
    if(f==="kg")for(let j=i+1;j<sets.length;j++){if(sets[j].kg!==old)break;sets[j].kg=v;const inp=document.querySelector(`[data-bind="rkg"][data-st="${k}"][data-i="${j}"]`);if(inp)inp.value=v}return}
  if(b==="q"){UI.q=v;const l=$("#libList");if(l){const q=slug(v);l.innerHTML=libRows(library().filter(x=>(!UI.muscle||x.m===UI.muscle)&&(!q||slug(x.n).includes(q)||slug(x.en||"").includes(q))).sort((a,c)=>a.n.localeCompare(c.n,"fr")))}return}
  if(b==="pq"){const l=$("#pickList");if(l)l.innerHTML=pickRows(v);return}
  if(b==="finNote"){S.live.fin.note=v;return}
  if(b==="finSpeed"){S.live.fin.speed=v;return}
  if(b==="finIncline"){S.live.fin.incline=v;return}
});
document.addEventListener("change",e=>{
  const b=e.target.dataset.bind;if(!b)return;const v=e.target.value;
  if(["rkg","rreps","finNote","finSpeed","finIncline"].includes(b)){saveLive();return}
  if(b==="lf"){const d=e.target.dataset;const l=S.logs[d.k];if(!l||!l.fin)return;const n=num(v);if(d.f==="min")l.fin.time=Math.round(n*60);else l.fin[d.f]=n;saveLog(d.k);return}
  if(b==="start"&&v){S.settings.start=v;saveState();render()}
  if(b==="progEx"){UI.progEx=v;render()}
  if(b==="ss"||b==="xss"){const d=e.target.dataset;const k=`p${d.p}s${d.s}`;const o=S.overrides[k]||(S.overrides[k]={});if(b==="ss"){o.ss=o.ss||{};o.ss[d.b]=e.target.checked}else if(o.extra&&o.extra[+d.i])o.extra[+d.i].ss=e.target.checked;saveState();render();return}
  if(b==="autoRest"){S.settings.autoRest=e.target.checked;saveState()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML)closeSheet()});
window.addEventListener("hashchange",()=>{closeSheet();render();window.scrollTo(0,0)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.live&&UI.view==="seance")keepAwake(true)});
render();
store.init();
</script>
</body>
</html>
